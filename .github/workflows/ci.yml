name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  score-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/score-engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar dependências
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Testes
        run: uv run pytest -v

  core-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helfy
          POSTGRES_PASSWORD: helfy
          POSTGRES_DB: helfy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helfy"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar dependências
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Testes
        run: uv run pytest -v
        env:
          CORE_TEST_DATABASE_URL: postgresql+psycopg://helfy:helfy@localhost:5432/helfy_test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Testes
        run: npm test -- --forceExit
      - name: Checagem de tipos
        run: npm run typecheck

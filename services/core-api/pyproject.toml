[project]
name = "core-api"
version = "1.0.0"
description = "Helfy — API de produto: auth, perfil, alimentos, dispensa, score e receitas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",
    "httpx>=0.27",
    "email-validator>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

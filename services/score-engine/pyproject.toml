[project]
name = "score-engine"
version = "1.0.0"
description = "Helfy — engine de score nutricional (par usuário × alimento)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "scikit-learn>=1.8",
    "pandas>=2.0",
    "numpy>=1.26",
    "joblib>=1.4",
    "pydantic>=2.7",
    "requests>=2.31",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
